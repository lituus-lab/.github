# The Conventional Commits check every Uni* repo runs, held once here. The
# twelve copies had drifted into five variants of the same 35 lines --
# different action pins, different permission blocks, the same intent.
name: Conventional commits

on:
  workflow_call:

# The action only reads the pull request title.
permissions:
  pull-requests: read

jobs:
  commitizen:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Kept in step with .cz.toml, which the pre-commit hook reads: a type
          # accepted locally and refused here would be a trap.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            bump
          validateSingleCommit: true
