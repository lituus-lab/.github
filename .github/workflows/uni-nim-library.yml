name: Uni* Nim library

# The CI every `Uni*` engine runs, held once instead of copied per repo. It was
# extracted from UniTemplate after that repo's own copy went green, and
# UniTemplate is its first caller: if the call stays green, the extraction was
# faithful.
#
# Nothing here acts on a repository that does not call it. A workflow reachable
# by `uses:` is inert until something uses it, so a project with a CI of its own
# shape -- `lituus`, and whatever comes next -- is unaffected by its existence.
#
# A caller adds its own jobs beside the call when it needs them: a job that has
# `uses:` cannot also have `steps:`, so repo-specific work is a separate job,
# and the caller's `all-green` covers both.
on:
  workflow_call:
    inputs:
      library:
        description: 'PascalCase library name: UniChecksum. Gives include/<library>.h, lib<library>.*, and the artifact names.'
        required: true
        type: string
      module:
        description: 'The library name in lower case: unichecksum. Names the Python import, tests/c/test_<module>.c, and the wheel artifacts. The PyPI distribution is lituus-<module>; the import name is not namespaced.'
        required: true
        type: string
      python-smoke-test:
        description: 'Test file copied outside the checkout to prove the installed wheel stands alone.'
        required: true
        type: string
      nim-version:
        description: 'Nim the matrix builds with.'
        required: false
        default: '2.2.10'
        type: string
      os:
        description: 'Runner matrix, as a JSON array.'
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
        type: string
      python-versions:
        description: 'CPython matrix, as a JSON array. Without Py_LIMITED_API each minor has its own C ABI, so each needs its own run.'
        required: false
        default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
        type: string
      apt-packages:
        description: 'Extra Debian packages the ubuntu runners install before building, space separated. Only for an engine that binds a system library: UniDAV needs libcurl headers, and a runner ships none. Empty everywhere else.'
        required: false
        default: ''
        type: string
      publish-pages:
        description: 'Deploy the built docs. Off by default: across the family every one of these deployments reports success while every site answers 404, and a job that is red forever teaches everyone to ignore red.'
        required: false
        default: false
        type: boolean

# Read-only by default; the one job that needs more declares it itself. A
# called workflow cannot obtain more than the calling job granted, so a caller
# that wants Pages grants `pages: write` and `id-token: write` on the call.
permissions:
  contents: read

defaults:
  run:
    # bash on every runner, Windows included: one spelling for the gate call,
    # and `py/dist/*.whl` expands (pwsh would hand the pattern through as-is).
    shell: bash

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Every commit must carry a Signed-off-by trailer
        run: |
          set -e
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          bad=0
          for c in $(git rev-list --no-merges "$range"); do
            # Parse the trailer block first, as tools/hooks/dco_check.sh does:
            # a bare grep also accepts a Signed-off-by quoted in the body.
            if ! git log -1 --format='%B' "$c" | git interpret-trailers --parse |
                 grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "Missing Signed-off-by on commit $c"
              git log -1 --oneline "$c"
              bad=1
            fi
          done
          exit $bad

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Mirrors tools/hooks/spdx_check.sh: every tracked Nim/C/Python source must
      # carry an SPDX-License-Identifier header in its first 5 lines.
      - name: Every Nim/C/Python source carries an SPDX header
        run: bash tools/hooks/spdx_check.sh

  test:
    name: Nim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Extra Debian packages
        # Only on ubuntu, only when a caller asked. macOS runners carry the
        # headers this exists for, and Windows uses its own APIs.
        if: runner.os == 'Linux' && inputs.apt-packages != ''
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2.3.0
        with:
          nim-version: ${{ inputs.nim-version }}
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      - run: $GATE testCi
      - run: $GATE testCiRelease
      # The example demos are part of the documented surface but no test
      # pulled them in; build and run them so a broken example fails CI.
      - run: $GATE example

  cabi:
    name: C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Extra Debian packages
        # Only on ubuntu, only when a caller asked. macOS runners carry the
        # headers this exists for, and Windows uses its own APIs.
        if: runner.os == 'Linux' && inputs.apt-packages != ''
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2.3.0
        with:
          nim-version: ${{ inputs.nim-version }}
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      # gcc arrives with Nim's MinGW, GNU make does not ship on the runner image.
      - name: Install GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: $GATE ctest
      # The C demo is part of the documented surface; nothing else builds it.
      - run: $GATE cexample
      # nimble ctest only builds the static lib (clibStatic); the shared lib
      # this job uploads below needs its own explicit build step.
      - run: $GATE clib
      - name: Upload Library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lib${{ inputs.library }}-${{ matrix.os }}
          # The header ships with the lib: a C ABI artifact without it is not
          # consumable. Paths stay repo-relative so the zip keeps include/ intact.
          path: |
            include/${{ inputs.library }}.h
            lib${{ inputs.library }}.so
            lib${{ inputs.library }}.dll
            lib${{ inputs.library }}.dylib
            lib${{ inputs.library }}.a
            lib${{ inputs.library }}.lib
  python:
    name: Python (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        # Every version release.yml ships a wheel for: without Py_LIMITED_API
        # each CPython minor has its own C ABI, so each needs its own run.
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Extra Debian packages
        # Only on ubuntu, only when a caller asked. macOS runners carry the
        # headers this exists for, and Windows uses its own APIs.
        if: runner.os == 'Linux' && inputs.apt-packages != ''
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2.3.0
        with:
          nim-version: ${{ inputs.nim-version }}
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -U setuptools wheel Cython pytest
      # CPython is MSVC-built here, so the lib it links must be too: put cl.exe on
      # PATH for `nimble pyLib`, which routes to clibMsvc on Windows.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - run: $GATE pyLib
      # `python3` isn't guaranteed on a Windows runner (actions/setup-python
      # only puts `python.exe` on PATH there); this job's matrix spans
      # windows-latest.
      - run: cd py && python setup.py build_ext --inplace
      - run: cd py && python -m pytest -q
      - run: cd py && python setup.py bdist_wheel
      - name: Repair Wheel (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install auditwheel
          auditwheel repair py/dist/*.whl -w py/dist/repaired/
      - name: Repair Wheel (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pip install delocate
          delocate-wheel py/dist/*.whl -w py/dist/repaired/
      - name: Repair Wheel (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pip install delvewheel
          delvewheel repair py/dist/*.whl -w py/dist/repaired/
      - name: Upload Python Wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.module }}-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: py/dist/repaired/*.whl

  consume-cabi:
    name: Consume C artifact (${{ matrix.os }})
    needs: cabi
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      # No setup-nim-action on purpose: proves the published header and lib work
      # on a machine without Nim, using only the test source from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lib${{ inputs.library }}-${{ matrix.os }}
          path: artifact
      # gcc arrives with Nim's MinGW, GNU make does not ship on the runner image.
      - name: Install GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - name: Extra Debian packages
        # This job links the archive against the system libraries the Makefile
        # names, so it needs them as much as the build jobs do -- more visibly,
        # since it has nothing else. It carries no setup-nim-action, which is
        # why it was missed when this input was added.
        if: runner.os == 'Linux' && inputs.apt-packages != ''
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}
      - name: Compile and run a consumer against the artifact
        run: |
          set -eu
          # Assert the shipped layout first: a missing piece names itself here,
          # rather than surfacing as an obscure compiler error.
          test -f artifact/include/${{ inputs.library }}.h
          test -f artifact/lib${{ inputs.library }}.a
          # The repo's own tests/c/Makefile does the link, pointed at the
          # downloaded artifact instead of the build tree: every library needs
          # a different set of system libraries beside the archive -- libm,
          # libz, the macOS media frameworks -- and the Makefile already
          # carries the right one. Compiling here instead would mean naming
          # them a second time, in a file that cannot see which are needed.
          # ROOT is relative because make runs with tests/c as its directory.
          make -C tests/c ROOT=../../artifact

  consume-wheel:
    name: Consume wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        # Mirrors the python job: a wheel only installs on the CPython minor
        # it was built for, so each one is consumed where it was produced.
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      # Neither Nim nor the built library exists here: whatever the extension needs
      # at runtime must have travelled inside the wheel.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.module }}-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist
      - name: Install the wheel and test the installed package
        run: |
          set -eu
          python -m pip install -U pip pytest
          # --only-binary rules out a silent fallback to building from source.
          python -m pip install --only-binary :all: dist/*.whl
          # Run outside the checkout so the import can only resolve to the
          # installed wheel, never to the package directory next door.
          work="$RUNNER_TEMP/wheel-check"
          mkdir -p "$work"
          cp ${{ inputs.python-smoke-test }} "$work/"
          cd "$work"
          python -m pytest -q
      - name: Execute the quickstart notebook against the installed wheel
        run: |
          set -eu
          # Two of the family have no quickstart yet. Say so and stop, rather
          # than failing on a missing file: the check is about a notebook that
          # lies, not about the absence of one.
          if [ ! -f py/notebooks/quickstart.ipynb ]; then
            echo "notebook: py/notebooks/quickstart.ipynb absent, nothing to check"
            exit 0
          fi
          python -m pip install nbconvert ipykernel
          # Same neutral directory, same reason. GitHub renders the outputs
          # committed in the file, so running the cells is not enough: what
          # ships is honest only if the fresh outputs match the stored ones.
          # Executing and discarding the result would prove the cells do not
          # raise, and let a stale value -- an old version string, say -- go on
          # being rendered as if it were current.
          work="$RUNNER_TEMP/wheel-check"
          cp py/notebooks/quickstart.ipynb "$work/committed.ipynb"
          cd "$work"
          jupyter nbconvert --execute --to notebook --output fresh.ipynb committed.ipynb
          python - <<'CHECK'
          import json, re, sys

          # Round every standalone float before comparing. A notebook that
          # demonstrates ULP-level behaviour prints a value whose last digits
          # differ between arm64 and x86_64, and comparing those verbatim
          # would make the check impossible to satisfy on both. The
          # lookarounds keep version strings out of it: the `1.0` inside
          # `1.0.0` is not a float, and a stale version is exactly what this
          # check is for.
          FLOAT = re.compile(r"(?<![\d.])-?\d+\.\d+(?:[eE][-+]?\d+)?(?![\d.])")

          def norm(text):
              return FLOAT.sub(lambda m: format(float(m.group()), ".10g"), text)

          def outputs(path):
              cells = json.load(open(path))["cells"]
              got = []
              for cell in cells:
                  if cell["cell_type"] != "code":
                      continue
                  text = []
                  for out in cell.get("outputs", []):
                      text += out.get("text", [])
                      text += out.get("data", {}).get("text/plain", [])
                  got.append(norm("".join(text).strip()))
              return got

          stored, fresh = outputs("committed.ipynb"), outputs("fresh.ipynb")
          if len(stored) != len(fresh):
              sys.exit(f"notebook: {len(stored)} code cells stored, {len(fresh)} ran")
          bad = [i for i, (a, b) in enumerate(zip(stored, fresh)) if a != b]
          for i in bad:
              print(f"cell {i}:\n  committed: {stored[i]!r}\n  actual:    {fresh[i]!r}",
                    file=sys.stderr)
          if bad:
              sys.exit("notebook: committed outputs are not what the code produces;"
                       " re-run py/notebooks/build_quickstart.py")
          print(f"notebook: {len(stored)} cells, committed outputs match")
          CHECK

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Extra Debian packages
        # Only on ubuntu, only when a caller asked. macOS runners carry the
        # headers this exists for, and Windows uses its own APIs.
        if: runner.os == 'Linux' && inputs.apt-packages != ''
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2.3.0
        with:
          nim-version: ${{ inputs.nim-version }}
      # checkVGraph compiles tools/vgraph.nim, which imports contracts (its
      # layerOf/layerOfModule postconditions) -- needs deps resolved first.
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      - run: $GATE lint
      - run: $GATE checkVGraph
      - name: Lint the workflows themselves
        # Catches a break in release.yml or commitizen.yml. It cannot catch one
        # in this file: GitHub refuses an unparseable workflow outright, with no
        # job and no log to read -- which is why the same check is a pre-commit
        # hook, where it runs before the push that would go dark.
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Extra Debian packages
        # Only on ubuntu, only when a caller asked. macOS runners carry the
        # headers this exists for, and Windows uses its own APIs.
        if: runner.os == 'Linux' && inputs.apt-packages != ''
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2.3.0
        with:
          nim-version: ${{ inputs.nim-version }}
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      # The nimib book links markdown, which loads libpcre at run time.
      # ubuntu-24.04 stopped shipping it, so the book compiles and the binary
      # dies on the first run: `could not load: libpcre.so(.3|.1|)`.
      - run: sudo apt-get update && sudo apt-get install -y libpcre3
      - run: $GATE docsDeps
      # nimib runs the book's code against this build: a stale book fails here.
      - run: $GATE docs
      - name: Upload Docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: pages/

  pages:
    name: Publish Pages
    needs: docs
    # Opt-in per repo, through the `PUBLISH_PAGES` repository variable. Across
    # the family today every one of these deployments reports success and every
    # site answers 404, with no Pages build ever recorded -- so the job is off
    # until that is understood, rather than red forever. A permanently red job
    # that nobody can fix teaches everyone to ignore red.
    if: ${{ inputs.publish-pages && !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow default outright, so the
      # checkout/artifact read has to be restated alongside the Pages grants.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  canary:
    name: Canary (the gate must fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Extra Debian packages
        # Only on ubuntu, only when a caller asked. macOS runners carry the
        # headers this exists for, and Windows uses its own APIs.
        if: runner.os == 'Linux' && inputs.apt-packages != ''
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2.3.0
        with:
          nim-version: ${{ inputs.nim-version }}
      - run: nimble install -y
      - name: Build the failure gate
        run: nim c --hints:off -o:build/unigate tools/gate.nim
      - name: A broken build must come back non-zero
        run: |
          # `nimble canary` compiles a source that cannot compile. Nimble
          # reports success for it; the gate is the only thing that does not.
          # If this step ever passes, every green result in this run is void.
          if ./build/unigate canary; then
            echo "canary: the gate let a broken build through" >&2
            exit 1
          fi
          echo "canary: the gate rejected a broken build, as it must"

  coverage:
    name: Coverage
    # Linux only: Apple's gcov is a clang stub emitting no .gcda, so the report
    # would come out empty on macOS. No lcov version pin needed — the task
    # suppresses no error, so 1.x and 2.x agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Extra Debian packages
        # Only on ubuntu, only when a caller asked. macOS runners carry the
        # headers this exists for, and Windows uses its own APIs.
        if: runner.os == 'Linux' && inputs.apt-packages != ''
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2.3.0
        with:
          nim-version: ${{ inputs.nim-version }}
      - run: sudo apt-get update && sudo apt-get install -y lcov
      - run: nimble install -y
      - name: Build the failure gate
        run: |
          # Nimble exits 0 even when an `exec` inside a task failed, so every
          # task below runs through the gate, which reads the task's own
          # success marker instead. Built from std only: nothing is resolved yet.
          GATE=build/unigate
          [ "$RUNNER_OS" = Windows ] && GATE=build/unigate.exe
          nim c --hints:off -o:$GATE tools/gate.nim
          echo "GATE=$GATE" >> "$GITHUB_ENV"
      - run: $GATE coverage
      - name: Upload Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: |
            coverage/
            lcov.info

